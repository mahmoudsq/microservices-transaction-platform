name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
 DOTNET_VERSION: '11.0.x'
 DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true